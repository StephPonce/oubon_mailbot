# Backend CI — runs on every push and PR touching Python code
name: Backend CI

on:
  push:
    branches: ["main"]
    paths:
      - "ospra_os/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "uv.lock"
      - "pytest.ini"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "ospra_os/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "uv.lock"
      - "pytest.ini"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Minimum env vars for app to import cleanly
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
      JWT_SECRET_KEY: ci_test_jwt_key_minimum_32_characters_long__
      SECRET_KEY: ci_test_secret_key_minimum_32_characters_long_
      EMAIL_OAUTH_ENCRYPTION_KEY: ci_test_fernet_key_minimum_32_chars_______

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --frozen --no-dev
          uv pip install ruff pytest pytest-asyncio httpx

      - name: Resolve-guard — plain pip must resolve requirements.txt (matches Render)
        run: |
          # Render installs with plain pip, which excludes pre-releases from
          # ranges like >=2.0.0. uv allows them, so a uv-only check misses
          # pins that break the Render build (e.g. the OTel openai-v2 pin).
          python -m venv /tmp/resolve-guard
          /tmp/resolve-guard/bin/pip install --quiet --upgrade pip
          /tmp/resolve-guard/bin/pip install --dry-run --quiet -r requirements.txt

      - name: Lint with ruff
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run ruff check ospra_os/ --output-format=github \
            || true  # soft-fail until lint cleanup (1,192 pre-existing errors in legacy modules)

      - name: Import smoke test (catches startup crashes)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run python -c "import ospra_os.main; print('ospra_os.main imports OK')"

      - name: Run targeted smoke tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Skip the full suite (heavy, hits external APIs). Run a targeted
          # subset that exercises critical paths without external deps.
          uv run pytest \
            tests/test_schemas.py \
            tests/test_priority_system.py \
            tests/test_auth.py \
            tests/test_security.py \
            --no-cov \
            -x \
            --tb=short \
            || true  # soft-fail until test suite is consolidated (task #31)

      - name: Check for hardcoded "Oubon" leakage in prompts/policies
        run: |
          # These modules must stay tenant-neutral since Pass 4b (commit a01830a).
          ! grep -rn "Oubon" ospra_os/email_automation/policies.py \
              ospra_os/ai/multi_provider_client.py \
              ospra_os/email_automation/smart_reply.py \
              ospra_os/email_automation/email_processor.py \
              | grep -v "DEFAULT_" | grep -v "# " | grep -v '"""'
