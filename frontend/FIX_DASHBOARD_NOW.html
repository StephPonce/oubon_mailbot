<!DOCTYPE html>
<html>
<head>
    <title>OSPRA DASHBOARD FIX - CLICK TO RUN</title>
    <style>
        body {
            background: #0a0a0f;
            color: white;
            font-family: Arial;
            padding: 40px;
            text-align: center;
        }
        button {
            background: #06b6d4;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 24px;
            border-radius: 10px;
            cursor: pointer;
            margin: 20px;
        }
        button:hover {
            background: #14b8a6;
        }
        .status {
            margin-top: 30px;
            font-size: 18px;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <h1>🔧 OSPRA DASHBOARD FIX</h1>
    <p>This will clear all cached data and force the dashboard to reload fresh.</p>

    <button onclick="fixDashboard()">FIX DASHBOARD NOW</button>

    <div id="status" class="status"></div>

    <script>
        function fixDashboard() {
            const status = document.getElementById('status');

            try {
                // Clear ALL storage
                localStorage.clear();
                sessionStorage.clear();

                // Clear IndexedDB (used by React Query)
                if ('indexedDB' in window) {
                    indexedDB.databases().then(dbs => {
                        dbs.forEach(db => indexedDB.deleteDatabase(db.name));
                    });
                }

                // Force onboarding to be completed
                localStorage.setItem('ospra-storage', JSON.stringify({
                    state: {
                        isOnboarded: true,
                        onboardingSteps: [
                            { id: 'welcome', title: 'Meet Ospra', completed: true },
                            { id: 'connect-shopify', title: 'Connect Shopify', completed: false },
                            { id: 'select-niches', title: 'Choose Niches', completed: false },
                            { id: 'enable-features', title: 'Enable Features', completed: false }
                        ],
                        preferences: {
                            selectedNiches: ['smart_home'],
                            selectedPlatform: null,
                            autoDeployEnabled: false,
                            notificationsEnabled: true,
                            dailyBriefingEnabled: true,
                            theme: 'light'
                        },
                        userName: 'User',
                        lastBriefingDate: null
                    },
                    version: 0
                }));

                status.innerHTML = '<div class="success">✅ FIXED! Redirecting to dashboard...</div>';

                // Redirect to dashboard after 2 seconds
                setTimeout(() => {
                    window.location.href = 'http://localhost:5173';
                }, 2000);

            } catch (error) {
                status.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
