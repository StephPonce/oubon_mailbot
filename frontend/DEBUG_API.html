<!DOCTYPE html>
<html>
<head>
    <title>API DEBUG - Ospra Dashboard</title>
    <style>
        body {
            background: #0a0a0f;
            color: white;
            font-family: 'Courier New', monospace;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .btn {
            background: #06b6d4;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 5px;
        }
        .btn:hover {
            background: #14b8a6;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            max-height: 600px;
            overflow-y: auto;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .warning { color: #f59e0b; }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        h1 { color: #06b6d4; }
        h2 { color: #8b5cf6; margin-top: 30px; }
    </style>
</head>
<body>
    <h1>🔍 OSPRA API DEBUGGER</h1>
    <p>This will test the Products API and show you exactly what's being returned.</p>

    <button class="btn" onclick="testAPI()">TEST PRODUCTS API</button>
    <button class="btn" onclick="testIntelligence()">TEST INTELLIGENCE API</button>
    <button class="btn" onclick="clearCache()">CLEAR ALL CACHES</button>

    <div id="result" class="result"></div>

    <script>
        const API_URL = 'http://localhost:8001';

        async function testAPI() {
            const result = document.getElementById('result');
            result.innerHTML = '<div class="warning">⏳ Testing Products API...</div>';

            try {
                // Test 1: Simple GET request
                const response = await fetch(`${API_URL}/api/dashboard/v2/products?limit=5`);
                const data = await response.json();

                let html = `<h2 class="success">✅ API Response (Status: ${response.status})</h2>`;
                html += `<p><strong>Products found:</strong> ${data.products ? data.products.length : 0}</p>`;
                html += `<p><strong>Total available:</strong> ${data.total || 'unknown'}</p>`;

                if (data.products && data.products.length > 0) {
                    html += `<h2>📦 First 3 Products:</h2>`;
                    data.products.slice(0, 3).forEach((product, i) => {
                        html += `<div style="margin: 15px 0; padding: 10px; background: rgba(6, 182, 212, 0.1); border-left: 3px solid #06b6d4;">`;
                        html += `<strong>${i + 1}. ${product.name || product.title}</strong><br>`;
                        html += `Score: ${product.score || 'N/A'} | `;
                        html += `Price: $${product.price || 'N/A'} | `;
                        html += `Niche: ${product.niche || 'N/A'}<br>`;
                        html += `ID: ${product.id}`;
                        html += `</div>`;
                    });
                } else {
                    html += `<div class="warning">⚠️ No products in response</div>`;
                }

                html += `<h2>📄 Full Response:</h2>`;
                html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;

                result.innerHTML = html;

            } catch (error) {
                result.innerHTML = `<h2 class="error">❌ Error</h2>`;
                result.innerHTML += `<p class="error">${error.message}</p>`;
                result.innerHTML += `<p>Make sure the backend is running on port 8001</p>`;
                result.innerHTML += `<pre>${error.stack}</pre>`;
            }
        }

        async function testIntelligence() {
            const result = document.getElementById('result');
            result.innerHTML = '<div class="warning">⏳ Testing Intelligence API...</div>';

            try {
                const response = await fetch(`${API_URL}/api/intelligence/briefing/morning`);
                const data = await response.json();

                let html = `<h2 class="success">✅ Intelligence API (Status: ${response.status})</h2>`;
                html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;

                result.innerHTML = html;

            } catch (error) {
                result.innerHTML = `<h2 class="error">❌ Error</h2>`;
                result.innerHTML += `<p class="error">${error.message}</p>`;
            }
        }

        function clearCache() {
            const result = document.getElementById('result');

            // Clear all storage
            localStorage.clear();
            sessionStorage.clear();

            // Clear IndexedDB
            if ('indexedDB' in window) {
                indexedDB.databases().then(dbs => {
                    dbs.forEach(db => {
                        console.log('Deleting:', db.name);
                        indexedDB.deleteDatabase(db.name);
                    });
                });
            }

            result.innerHTML = `<h2 class="success">✅ All caches cleared</h2>`;
            result.innerHTML += `<p>Refresh the main dashboard (http://localhost:5173) to see the effect</p>`;
        }

        // Auto-run test on load
        window.addEventListener('load', () => {
            setTimeout(testAPI, 500);
        });
    </script>
</body>
</html>
