<!DOCTYPE html>
<html>
<head>
    <title>DIRECT API TEST</title>
    <style>
        body {
            background: #0a0a0f;
            color: white;
            font-family: 'Courier New', monospace;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .btn {
            background: #06b6d4;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 5px;
        }
        .btn:hover {
            background: #14b8a6;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            max-height: 700px;
            overflow-y: auto;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .warning { color: #f59e0b; }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 12px;
        }
        h1 { color: #06b6d4; }
        h2 { color: #8b5cf6; margin-top: 30px; }
        .product-card {
            margin: 15px 0;
            padding: 15px;
            background: rgba(6, 182, 212, 0.1);
            border-left: 4px solid #06b6d4;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>🔬 DIRECT API TEST (NO CACHING)</h1>
    <p>This page makes a direct fetch call to the API, bypassing ALL React/React Query code.</p>

    <button class="btn" onclick="testDirectAPI()">TEST API DIRECTLY</button>
    <button class="btn" onclick="testWithDifferentURL()">TEST WITH 127.0.0.1</button>
    <button class="btn" onclick="checkCORS()">CHECK CORS</button>

    <div id="result" class="result"></div>

    <script>
        const API_URL = 'http://localhost:8001';
        const API_URL_ALT = 'http://127.0.0.1:8001';

        async function testDirectAPI() {
            const result = document.getElementById('result');
            result.innerHTML = '<div class="warning">⏳ Testing API with direct fetch...</div>';

            console.log('🔍 Starting direct API test...');

            try {
                const url = `${API_URL}/api/dashboard/v2/products?limit=20`;
                console.log('📡 Fetching:', url);

                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    }
                });

                console.log('📥 Response status:', response.status);
                console.log('📥 Response headers:', response.headers);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log('✅ Data received:', data);

                let html = `<h2 class="success">✅ API WORKING! (Status: ${response.status})</h2>`;
                html += `<p><strong>Products found:</strong> ${data.products ? data.products.length : 0}</p>`;
                html += `<p><strong>Total available:</strong> ${data.total || 'unknown'}</p>`;
                html += `<p><strong>Page:</strong> ${data.page || 1} of ${data.pages || 'unknown'}</p>`;

                if (data.products && data.products.length > 0) {
                    html += `<h2>📦 Products (showing first 5):</h2>`;
                    data.products.slice(0, 5).forEach((product, i) => {
                        html += `<div class="product-card">`;
                        html += `<strong>${i + 1}. ${product.name || product.title || 'Untitled'}</strong><br>`;
                        html += `<small>ID: ${product.id}</small><br>`;
                        html += `Score: <strong>${product.score || 'N/A'}</strong> | `;
                        html += `Price: <strong>$${product.price || 'N/A'}</strong> | `;
                        html += `Niche: <strong>${product.niche || 'N/A'}</strong><br>`;
                        if (product.source) html += `Source: ${product.source}<br>`;
                        html += `</div>`;
                    });

                    html += `<h2>✅ CONCLUSION:</h2>`;
                    html += `<div class="success" style="padding: 20px; font-size: 18px;">`;
                    html += `The API is working perfectly and returning ${data.products.length} products.<br>`;
                    html += `If the main dashboard is not showing products, it's a FRONTEND CACHING issue.<br><br>`;
                    html += `<strong>SOLUTION:</strong><br>`;
                    html += `1. Open the main dashboard (http://localhost:5173)<br>`;
                    html += `2. Open DevTools (Cmd+Option+I or F12)<br>`;
                    html += `3. Go to Application tab > Clear site data<br>`;
                    html += `4. Hard refresh with Cmd+Shift+R<br>`;
                    html += `</div>`;
                } else {
                    html += `<div class="error">❌ No products in API response!</div>`;
                    html += `<p>The API is responding but returning no products. Check the backend database.</p>`;
                }

                html += `<h2>📄 Full API Response:</h2>`;
                html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;

                result.innerHTML = html;

            } catch (error) {
                console.error('❌ Error:', error);
                result.innerHTML = `<h2 class="error">❌ API ERROR</h2>`;
                result.innerHTML += `<p class="error"><strong>${error.message}</strong></p>`;
                result.innerHTML += `<p>Possible causes:</p>`;
                result.innerHTML += `<ul>`;
                result.innerHTML += `<li>Backend not running on port 8001</li>`;
                result.innerHTML += `<li>CORS issue (check browser console)</li>`;
                result.innerHTML += `<li>Network error</li>`;
                result.innerHTML += `</ul>`;
                result.innerHTML += `<pre>${error.stack}</pre>`;
            }
        }

        async function testWithDifferentURL() {
            const result = document.getElementById('result');
            result.innerHTML = '<div class="warning">⏳ Testing with 127.0.0.1...</div>';

            try {
                const url = `${API_URL_ALT}/api/dashboard/v2/products?limit=5`;
                const response = await fetch(url);
                const data = await response.json();

                let html = `<h2 class="success">✅ Alternative URL works! (Status: ${response.status})</h2>`;
                html += `<p>Products found: ${data.products ? data.products.length : 0}</p>`;
                html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                result.innerHTML = html;
            } catch (error) {
                result.innerHTML = `<h2 class="error">❌ Error with 127.0.0.1</h2>`;
                result.innerHTML += `<p>${error.message}</p>`;
            }
        }

        async function checkCORS() {
            const result = document.getElementById('result');
            result.innerHTML = '<div class="warning">⏳ Checking CORS configuration...</div>';

            try {
                const response = await fetch(`${API_URL}/health`, {
                    method: 'OPTIONS'
                });

                let html = `<h2 class="success">✅ CORS check complete</h2>`;
                html += `<p><strong>Access-Control-Allow-Origin:</strong> ${response.headers.get('Access-Control-Allow-Origin') || 'Not set'}</p>`;
                html += `<p><strong>Access-Control-Allow-Methods:</strong> ${response.headers.get('Access-Control-Allow-Methods') || 'Not set'}</p>`;
                result.innerHTML = html;
            } catch (error) {
                result.innerHTML = `<h2 class="error">❌ CORS Error</h2>`;
                result.innerHTML += `<p>${error.message}</p>`;
            }
        }

        // Auto-run test on load
        window.addEventListener('load', () => {
            console.log('🚀 Page loaded, running automatic test...');
            setTimeout(testDirectAPI, 1000);
        });
    </script>
</body>
</html>
