[pytest]
# Pytest configuration for OspraOS

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum version
minversion = 7.0

# Add current directory to Python path
pythonpath = .

# Async support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Strict config (fail on config errors)
    --strict-config
    # Show warnings
    -W default
    # Coverage options (when using pytest-cov). The ``--cov-report=json``
    # writer hits ``OSError: Resource deadlock avoided`` when the working
    # directory sits on certain mounted filesystems (sandboxed dev
    # environments) — keep HTML + term-missing for humans and let CI add
    # JSON itself if it needs the machine-readable form.
    --cov=ospra_os
    --cov-report=html
    --cov-report=term-missing
    # Fail if coverage is below threshold
    --cov-fail-under=70
    # Performance: use multiple CPUs
    -n auto
    # Distribute by file (each test file goes entirely to one worker).
    # Default ``--dist=load`` splits files across workers, which exposed
    # cross-file shared-state issues (e.g. process-global Webhook
    # verifier cache, FastAPI dependency overrides). loadfile is
    # actually faster too — fixtures with file-scoped setup are reused
    # within a worker. Documented in audit fix #11 follow-up.
    --dist=loadfile
    # Show durations of slowest tests
    --durations=10

# Test markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for API endpoints
    e2e: End-to-end tests for complete workflows
    slow: Tests that take a long time to run
    asyncio: Tests that use async/await

# Ignore paths
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .venv
    venv
    node_modules
    frontend

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/test.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    # Ignore specific warnings from dependencies
    ignore::DeprecationWarning:passlib
    ignore::DeprecationWarning:sqlalchemy
    ignore::PendingDeprecationWarning
    # stdlib datetime.utcnow() deprecation (Python 3.12+). The codebase uses
    # utcnow() in hundreds of places (deliberately, matching naive-UTC DateTime
    # columns), so promoting it to an error under `error` mode created
    # ORDER-DEPENDENT failures: Python fires each deprecation once per
    # call-site, so whichever test hit a given utcnow() line first "ate" the
    # error while later ones passed — a landmine that reshuffled with any
    # change to test collection order. Ignoring it makes the suite
    # deterministic; the utcnow -> now(timezone.utc) migration is tracked
    # separately and this masks no app regression.
    ignore:.*datetime\.datetime\.utcnow\(\) is deprecated.*:DeprecationWarning
    # Ignore internal ospra_os deprecation shims (e.g. self_learning_engine ->
    # hybrid_learning_engine). These warnings fire at *import* time, which turns
    # into an ImportError under `error` mode during conftest collection. The
    # deprecations are tracked in TASKS.md — suppressing them here does not
    # mask real regressions.
    ignore::DeprecationWarning:ospra_os.learning.self_learning_engine
    ignore::DeprecationWarning:ospra_os
    # Message-based catch for deprecation shims that use `stacklevel=2` —
    # those warnings are attributed to the caller's module, not to ospra_os,
    # so the module-based filter above doesn't match.
    ignore:.*ospra_os\.intelligence\.self_learning is deprecated.*:DeprecationWarning
    ignore:.*ospra_os\.learning\.self_learning_engine is deprecated.*:DeprecationWarning
    ignore:.*SelfLearningEngine is deprecated.*:DeprecationWarning
    # Pydantic class-based config deprecation — Pass 4d migrated all 15 class
    # Config blocks across 10 files to ConfigDict, all @validator -> @field_validator,
    # and Field(..., regex=) -> Field(..., pattern=). No first-party code emits
    # PydanticDeprecatedSince20 anymore; the filter below catches any lingering
    # warnings from transitive deps (see also the module-scoped ignore below).
    # ignore::pydantic.warnings.PydanticDeprecatedSince20  # removed Pass 4d
    # Test-only JWT secret: the app emits RuntimeWarning when JWT_SECRET_KEY
    # looks like a default; our test fixture sets a stable non-secret string.
    ignore:.*JWT_SECRET_KEY.*:RuntimeWarning
    # Token blacklist in-memory fallback: tests don't use Redis.
    ignore:.*token blacklist.*:RuntimeWarning
    # Pydantic v1 deprecation warnings from third-party libs that pin old schemas
    ignore::DeprecationWarning:pydantic
    # FastAPI on_event -> lifespan migration completed in Pass 4d — the
    # @app.on_event("startup"|"shutdown") pair in ospra_os/main.py is now a
    # single `lifespan=app_lifespan` context manager. The broad scoped
    # ignores below (fastapi/starlette/typing_extensions) are kept because
    # third-party deps (e.g. older fastapi submodules) may still emit
    # unrelated deprecations; revisit once the full dep tree upgrades past
    # the @deprecated shim in typing_extensions.
    ignore::DeprecationWarning:fastapi
    ignore::DeprecationWarning:starlette
    ignore::DeprecationWarning:typing_extensions
    # google.protobuf emits DeprecationWarnings from transitive deps (grpc, google-ads)
    ignore::DeprecationWarning:google
    ignore::DeprecationWarning:google.protobuf
    # google.api_core warns at *import time* about Python 3.10 EOL (2026-10-04).
    # Tracked under task #39 (Python 3.12 + tz-aware migration); ignore until
    # the runtime upgrade lands so test collection isn't blocked.
    ignore::FutureWarning:google.api_core
    ignore:.*google\.api_core.*Python version.*:FutureWarning
    # httplib2 (transitively imported by google-generativeai) uses deprecated
    # pyparsing.setName at import time. Out of our control until httplib2
    # ships a fix or google-generativeai swaps transports.
    ignore::DeprecationWarning:httplib2
    ignore::DeprecationWarning:pyparsing
    ignore:.*setName.*deprecated.*:DeprecationWarning
    ignore:.*setName.*deprecated.*
    # google.generativeai is deprecated in favor of google.genai. Migration
    # tracked separately; ignore the import-time FutureWarning so test
    # collection isn't blocked.
    ignore::FutureWarning:google.generativeai
    ignore:.*google\.generativeai.*:FutureWarning
    ignore:.*All support for the.*google.*package has ended.*:FutureWarning
    ignore:.*generativeai.*package has ended.*
    # apscheduler uses datetime.utcnow() — will be migrated in Pass 4d
    ignore::DeprecationWarning:apscheduler
    # httpx 0.28.x + starlette TestClient teardown previously raised a
    # PytestUnraisableExceptionWarning via AsyncHttpxClientWrapper.__del__
    # before its `_state` attribute was set. Starlette 0.48 removed that
    # wrapper (TestClient now uses httpx's portal-based transport directly),
    # so the warning no longer fires under fastapi 0.118 + starlette 0.48 +
    # httpx 0.28.1. The ignore has been removed as of Pass 4d; if the warning
    # reappears, the failure trace will point at the offending client.
    # ignore::pytest.PytestUnraisableExceptionWarning  # removed Pass 4d
