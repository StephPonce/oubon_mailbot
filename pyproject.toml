[project]
name = "ospra_os"
version = "0.1.0"
description = "Ospra OS: AI-powered e-commerce automation — product discovery, social sentiment, AI grading, Shopify deployment, and Gmail customer support."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "aiosqlite>=0.21.0",
    "python-dotenv>=1.0.0",
    "google-auth>=2.34.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.141.0",
    "msal>=1.25.0",
    "cryptography>=41.0.0",
    "google-ads>=25.0.0",
    "SQLAlchemy>=2.0.32",
    "alembic>=1.13.2",
    "openai>=1.42.0",
    "anthropic>=0.34.0",
    "requests>=2.32.3",
    "jinja2>=3.1.4",
    "slack_sdk>=3.33.1",
    "email-validator>=2.2.0",
    "apscheduler>=3.10.4",
    "aiohttp>=3.10.0",
    "pytrends>=4.9.2",
    "praw>=7.7.1",
    "pytz>=2024.1",
    "httpx>=0.27.0",
    "playwright>=1.55.0",
    "fake-useragent>=2.2.0",
    "tenacity>=9.1.2",
    "python-multipart>=0.0.20",
    "google-generativeai>=0.8.5",
    "python-amazon-sp-api>=1.9.50",
    "python-amazon-paapi==5.0.1",
    "pytest-asyncio>=1.3.0",
    "psutil>=6.1.0",
    "apify-client==1.6.3",
    "facebook-business>=24.0.0",
    "beautifulsoup4>=4.14.2",
    "schedule>=1.2.2",
    "rembg>=2.0.69",
    "pillow>=12.0.0",
    "onnxruntime>=1.23.2",
    "sentry-sdk[fastapi,httpx,sqlalchemy]>=2.47.0",
    "resend>=2.19.0",
]

[project.optional-dependencies]
worker = ["redis>=5.0.8", "rq>=1.16.2"]
gcp = ["google-cloud-pubsub>=2.21.6"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.2",
    "httpx>=0.27.0",
    "ruff>=0.6.9",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
]
