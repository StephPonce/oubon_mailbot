# Render Blueprint - Ospra Intelligence Backend
# https://render.com/docs/blueprint-spec

databases:
  - name: ospra-db
    databaseName: ospra_intelligence
    user: ospra
    plan: free  # Free PostgreSQL tier

services:
  - type: web
    name: ospra-intelligence-api
    runtime: python
    plan: starter  # $7/mo - always on, no sleep
    region: oregon
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: ospra-db
          property: connectionString
