# Render Blueprint - Ospra Intelligence
# https://render.com/docs/blueprint-spec

# =============================================================================
# DATABASE
# =============================================================================
databases:
  - name: ospra-db
    databaseName: ospra_intelligence
    user: ospra_admin
    plan: starter

# =============================================================================
# SERVICES
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # BACKEND API
  # ---------------------------------------------------------------------------
  - type: web
    name: ospra-intelligence-api
    runtime: python
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn ospra_os.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # System
      - key: PYTHON_VERSION
        value: "3.11"

      # Database (auto-linked from Render database)
      - key: DATABASE_URL
        fromDatabase:
          name: ospra-db
          property: connectionString

      # AI API Keys (set in Render Dashboard > Environment)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: STABILITY_API_KEY
        sync: false

      # JWT Authentication Secret (CRITICAL - set in Render Dashboard)
      - key: JWT_SECRET_KEY
        sync: false

      # AliExpress Credentials
      - key: ALIEXPRESS_APP_KEY
        sync: false
      - key: ALIEXPRESS_APP_SECRET
        sync: false
      - key: ALIEXPRESS_ACCESS_TOKEN
        sync: false
      # OAuth callback redirect URIs — must point at THIS API host. Defaults in
      # code already use the API host; override here if the host ever changes.
      - key: ALIEXPRESS_REDIRECT_URI
        value: "https://ospra-intelligence-api.onrender.com/api/aliexpress/callback"
      - key: ALIEXPRESS_AFFILIATE_REDIRECT_URI
        value: "https://ospra-intelligence-api.onrender.com/api/aliexpress-affiliate/callback"

      # Other API Keys
      - key: CJ_ACCESS_TOKEN
        sync: false
      # Task #15: CJ_EMAIL + CJ_API_KEY enable auto-refresh so 401s self-heal
      # (no manual token swaps). Optional — falls back to the static token above.
      - key: CJ_EMAIL
        sync: false
      - key: CJ_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false

      # Reddit signal source (set values in Render Dashboard > Environment).
      # Without these, prod discovery loses the Reddit sentiment source that
      # local has.
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        sync: false

      # Email (Resend)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        value: "noreply@ospra.io"
      - key: APP_URL
        value: "https://ospra.io"
      
      # LemonSqueezy Payment
      - key: LEMONSQUEEZY_API_KEY
        sync: false
      - key: LEMONSQUEEZY_STORE_ID
        sync: false
      - key: LEMONSQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: LEMONSQUEEZY_FLIGHT_MONTHLY_VARIANT
        sync: false
      - key: LEMONSQUEEZY_FLIGHT_YEARLY_VARIANT
        sync: false
      - key: LEMONSQUEEZY_SOAR_MONTHLY_VARIANT
        sync: false
      - key: LEMONSQUEEZY_SOAR_YEARLY_VARIANT
        sync: false
      - key: LEMONSQUEEZY_STRATOSPHERE_MONTHLY_VARIANT
        sync: false
      - key: LEMONSQUEEZY_STRATOSPHERE_YEARLY_VARIANT
        sync: false

  # ---------------------------------------------------------------------------
  # TREND PRE-WARM CRON (task #47)
  # Runs the slow (~12 min) Apify Google-Trends actor off the request path
  # every 12h and upserts cached_google_trends, which the API reads inline.
  # Needs only DATABASE_URL + APIFY_API_TOKEN — no Redis, no worker.
  # ---------------------------------------------------------------------------
  - type: cron
    name: ospra-trend-warm
    runtime: python
    plan: starter
    region: oregon
    rootDir: .
    schedule: "0 */12 * * *"
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python -m ospra_os.tasks.trend_warm
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: ospra-db
          property: connectionString
      - key: APIFY_API_TOKEN
        sync: false
      - key: TREND_WARM_NICHES
        value: "smart_home,tech"
      - key: TREND_WARM_MAX_TERMS
        value: "25"

  # ---------------------------------------------------------------------------
  # CATALOG WARM CRON (#56)
  # Runs the REAL discovery engine across niches and upserts graded products
  # into discovered_catalog (the persistent, cross-process store the API reads
  # via /api/discovery/catalog). This is what populates the dashboard with
  # DOZENS of graded products + days-of-proof instead of one on-demand result.
  # Runs at 01:00 / 13:00 UTC — an hour after trend-warm so Trends are fresh.
  # Needs discovery's full credential set (sentiment + suppliers + apify).
  # ---------------------------------------------------------------------------
  - type: cron
    name: ospra-catalog-warm
    runtime: python
    plan: starter
    region: oregon
    rootDir: .
    schedule: "0 1,13 * * *"
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python -m ospra_os.tasks.catalog_warm
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: ospra-db
          property: connectionString
      # Niches to build the catalog for (start modest to bound cron cost/runtime).
      - key: DISCOVERY_CATALOG_NICHES
        value: "smart_home,tech,kitchen,fitness,beauty"
      - key: DISCOVERY_CATALOG_COUNT
        value: "20"
      # AI grading + sentiment
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      # Suppliers
      - key: CJ_ACCESS_TOKEN
        sync: false
      # Task #15: CJ_EMAIL + CJ_API_KEY enable auto-refresh so 401s self-heal
      # (no manual token swaps). Optional — falls back to the static token above.
      - key: CJ_EMAIL
        sync: false
      - key: CJ_API_KEY
        sync: false
      - key: ALIEXPRESS_APP_KEY
        sync: false
      - key: ALIEXPRESS_APP_SECRET
        sync: false
      - key: ALIEXPRESS_ACCESS_TOKEN
        sync: false
      # Trends / social signals
      - key: APIFY_API_TOKEN
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        sync: false

  # ---------------------------------------------------------------------------
  # FRONTEND STATIC SITE
  # ---------------------------------------------------------------------------
  - type: web
    name: ospra-frontend
    runtime: static
    plan: starter
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://ospra-intelligence-api.onrender.com"
