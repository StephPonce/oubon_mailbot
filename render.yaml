# Render Blueprint - Ospra Intelligence
# https://render.com/docs/blueprint-spec

# =============================================================================
# DATABASE
# =============================================================================
databases:
  - name: ospra-db
    databaseName: ospra_intelligence
    user: ospra_admin
    plan: starter

# =============================================================================
# SERVICES
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # BACKEND API
  # ---------------------------------------------------------------------------
  - type: web
    name: ospra-intelligence-api
    runtime: python
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn ospra_os.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # System
      - key: PYTHON_VERSION
        value: "3.11"

      # Database (auto-linked from Render database)
      - key: DATABASE_URL
        fromDatabase:
          name: ospra-db
          property: connectionString

      # AI API Keys (set in Render Dashboard > Environment)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: STABILITY_API_KEY
        sync: false

      # JWT Authentication Secret (CRITICAL - set in Render Dashboard)
      - key: JWT_SECRET_KEY
        sync: false

      # AliExpress Credentials
      - key: ALIEXPRESS_APP_KEY
        sync: false
      - key: ALIEXPRESS_APP_SECRET
        sync: false
      - key: ALIEXPRESS_ACCESS_TOKEN
        sync: false

      # Other API Keys
      - key: CJ_ACCESS_TOKEN
        sync: false
      - key: APIFY_API_TOKEN
        sync: false

      # Reddit signal source (set values in Render Dashboard > Environment).
      # Without these, prod discovery loses the Reddit sentiment source that
      # local has.
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        sync: false

      # Email (Resend)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        value: "noreply@ospra.io"
      - key: APP_URL
        value: "https://ospra.io"
      
      # LemonSqueezy Payment
      - key: LEMONSQUEEZY_STORE_ID
        sync: false
      - key: LEMONSQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: LEMONSQUEEZY_FLIGHT_MONTHLY_VARIANT
        sync: false
      - key: LEMONSQUEEZY_FLIGHT_YEARLY_VARIANT
        sync: false
      - key: LEMONSQUEEZY_SOAR_MONTHLY_VARIANT
        sync: false
      - key: LEMONSQUEEZY_SOAR_YEARLY_VARIANT
        sync: false
      - key: LEMONSQUEEZY_STRATOSPHERE_MONTHLY_VARIANT
        sync: false
      - key: LEMONSQUEEZY_STRATOSPHERE_YEARLY_VARIANT
        sync: false

  # ---------------------------------------------------------------------------
  # FRONTEND STATIC SITE
  # ---------------------------------------------------------------------------
  - type: web
    name: ospra-frontend
    runtime: static
    plan: starter
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://ospra-intelligence-api.onrender.com"
