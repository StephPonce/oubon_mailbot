services:
  # ═══════════════════════════════════════════════════════════
  # MAIN WEB SERVICE - Ospra Intelligence API (with Authentication)
  # ═══════════════════════════════════════════════════════════
  - type: web
    name: oubon-mailbot
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn ospra_os.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120 --workers 1"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # JWT Authentication
      - key: JWT_SECRET_KEY
        generateValue: true  # Render will auto-generate a secure random key
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440  # 24 hours
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 30
      # PostgreSQL connection (auto-populated by Render)
      - key: DATABASE_URL
        fromDatabase:
          name: ospra-db
          property: connectionString
      # SQLAlchemy async driver for PostgreSQL
      - key: OUBONSHOP_database_url
        fromDatabase:
          name: ospra-db
          property: connectionString

  # ═══════════════════════════════════════════════════════════
  # CRON JOB: Email Checker (every 5 minutes)
  # ═══════════════════════════════════════════════════════════
  - type: cron
    name: oubon-mailbot-cron
    env: python
    schedule: "*/5 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run_email_check.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: ospra-db
          property: connectionString

  # ═══════════════════════════════════════════════════════════
  # CRON JOB: Product Discovery (daily at 3 AM UTC)
  # ═══════════════════════════════════════════════════════════
  - type: cron
    name: ospra-product-discovery
    env: python
    schedule: "0 3 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -c \"import asyncio; from ospra_os.background_jobs.auto_discovery import run_discovery; asyncio.run(run_discovery())\""
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: ospra-db
          property: connectionString

  # ═══════════════════════════════════════════════════════════
  # CRON JOB: Daily Rankings Update (daily at 3:30 AM UTC)
  # ═══════════════════════════════════════════════════════════
  - type: cron
    name: ospra-daily-rankings
    env: python
    schedule: "30 3 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -c \"import asyncio; from ospra_os.background_jobs.daily_ranking_job import run_daily_ranking; asyncio.run(run_daily_ranking())\""
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: ospra-db
          property: connectionString

# ═══════════════════════════════════════════════════════════
# DATABASE - PostgreSQL (Free tier)
# ═══════════════════════════════════════════════════════════
databases:
  - name: ospra-db
    databaseName: ospra_intelligence
    user: ospra_admin
    plan: free  # Free tier: 1GB storage, 97 days retention
